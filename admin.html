<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - License Management</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; padding: 40px; background: #f3f4f6; color: #333; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 13px; }
    th { background: #f9fafb; font-weight: 600; color: #111; }
    .active { color: #059669; font-weight: 600; }
    .expired { color: #dc2626; font-weight: 600; }
    .stats { display: flex; gap: 20px; margin-bottom: 20px; }
    .stat-box { background: #fff; border-radius: 8px; padding: 16px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); flex: 1; }
    .stat-box h3 { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
    .stat-box .num { font-size: 28px; font-weight: 800; color: #111; }
    .login-box { background: #fff; border-radius: 8px; padding: 40px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 400px; margin: 100px auto; }
    .login-box input { padding: 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; width: 100%; margin-bottom: 12px; }
    .login-box button { padding: 10px 24px; background: #6366f1; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
    .error { color: #dc2626; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="login">
    <div class="login-box">
      <h2 style="margin-bottom:16px;">Admin Login</h2>
      <input type="password" id="pwdInput" placeholder="Enter admin password" />
      <button onclick="login()">Login</button>
      <div id="loginError" class="error"></div>
    </div>
  </div>
  <div id="dashboard" style="display:none;">
    <div class="container">
      <h1>License Management</h1>
      <div class="stats" id="stats"></div>
      <table>
        <thead>
          <tr><th>Email</th><th>License Key</th><th>Created</th><th>Days Left</th><th>Status</th></tr>
        </thead>
        <tbody id="licenseTable"></tbody>
      </table>
      <p style="margin-top:16px;font-size:12px;color:#9ca3af;">
        Licenses expire after 30 days. Users must renew monthly via PayPal.
      </p>
    </div>
  </div>
  <script>
    const ADMIN_PWD = 'admin123';

    function login() {
      const pwd = document.getElementById('pwdInput').value;
      if (pwd === ADMIN_PWD) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadLicenses();
      } else {
        document.getElementById('loginError').textContent = 'Wrong password';
      }
    }

    async function loadLicenses() {
      const res = await fetch('/api/licenses');
      const data = await res.json();
      const active = data.filter(l => !l.expired && l.active);
      document.getElementById('stats').innerHTML =
        `<div class="stat-box"><h3>Total Licenses</h3><div class="num">${data.length}</div></div>` +
        `<div class="stat-box"><h3>Active</h3><div class="num">${active.length}</div></div>` +
        `<div class="stat-box"><h3>Expired</h3><div class="num">${data.length - active.length}</div></div>`;
      document.getElementById('licenseTable').innerHTML = data.map(l =>
        `<tr>
          <td>${l.email}</td>
          <td style="font-family:monospace;font-size:12px;">${l.key}</td>
          <td>${new Date(l.created).toLocaleDateString()}</td>
          <td>${l.expired ? 'Expired' : l.daysLeft + ' days'}</td>
          <td class="${l.expired ? 'expired' : 'active'}">${l.expired ? 'Expired' : 'Active'}</td>
        </tr>`
      ).join('');
    }
  </script>
</body>
</html>
