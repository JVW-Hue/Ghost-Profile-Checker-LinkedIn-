<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" href="popup.css">
  <title>Ghost Profile Checker</title>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="logo">👻</span>
      <h1>Ghost Profile Checker</h1>
      <span id="premiumBadge" class="premium-badge" style="display:none;">PREMIUM</span>
    </div>

    <div id="licenseSection" class="license-section">
      <div id="licenseStatus" class="license-status"></div>
      <div id="licenseInputGroup" class="license-input-group">
        <input type="text" id="licenseKeyInput" placeholder="Enter premium license key" class="license-input" />
        <button id="activateBtn" class="btn-small">Activate</button>
      </div>
      <button id="getPremiumBtn" class="btn-premium">Get Premium - $2.99/mo</button>
      <div id="licenseThanks" class="license-thanks" style="display:none;">
        <span>Premium active</span>
        <button id="deactivateBtn" class="btn-small btn-ghost">Deactivate</button>
      </div>
    </div>

    <div id="profileInfo" class="profile-info" style="display:none;">
      <div id="profileName" class="profile-name"></div>
      <div id="profileHeadline" class="profile-headline"></div>
      <div id="profileMeta" class="profile-meta"></div>
    </div>

    <div id="loadingIndicator" class="loading">
      <div class="spinner"></div>
      <span>Analyzing profile...</span>
    </div>

    <div id="freeResult" class="free-result" style="display:none;">
      <div class="free-info">
        <p>Profile detected. Upgrade to Premium for full analysis including ghost score, activity check, engagement metrics, and more.</p>
      </div>
    </div>

    <div id="premiumResult" class="results" style="display:none;">
      <div class="score-section">
        <div class="score-label">Ghost Score</div>
        <div id="scoreValue" class="score">--</div>
        <div id="statusBadge" class="badge">Unknown</div>
      </div>

      <div class="details-section">
        <div class="section-title">Analysis</div>
        <ul id="reasonsList"></ul>
      </div>

      <div id="exportSection" class="export-section">
        <button id="exportBtn" class="btn-secondary">Export Report</button>
      </div>
    </div>

    <button id="refreshBtn" class="btn-primary">
      <span class="btn-icon">↻</span> Analyze Current Profile
    </button>

    <div class="footer">
      <span class="version">v1.0.0</span>
      <a id="supportLink" href="#" class="support-link">Support</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
